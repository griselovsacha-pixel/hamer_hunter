<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamer Hunter - Vulnerability Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .lion-logo { animation: roar 3s infinite alternate; }
        @keyframes roar {
            0% { transform: scale(1) rotate(-3deg); }
            100% { transform: scale(1.05) rotate(3deg); }
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">
    <div class="min-h-screen">
        <header class="border-b border-red-900 bg-black py-4">
            <div class="max-w-6xl mx-auto px-6 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <img src="https://i.ibb.co/pbwGZ/Fierce-red-lion.png" alt="Hamer Hunter" class="w-12 h-12 lion-logo">
                    <div>
                        <h1 class="text-3xl font-bold tracking-tighter text-red-500">HAMER HUNTER</h1>
                        <p class="text-xs text-zinc-500 -mt-1">VULNERABILITY SCANNER</p>
                    </div>
                </div>
                <div class="text-red-600 text-sm font-mono">by Хамер</div>
            </div>
        </header>

        <div class="max-w-4xl mx-auto px-6 py-12">
            <div class="text-center mb-10">
                <h2 class="text-5xl font-bold mb-3">Знаходь уразливості першим</h2>
                <p class="text-zinc-400">Потужний сканер для етичних хакерів</p>
            </div>

            <div class="bg-zinc-900 rounded-3xl p-8 border border-red-900/50">
                <form id="scanForm" class="space-y-6">
                    <div>
                        <label class="block text-sm text-zinc-400 mb-2">Цільовий URL</label>
                        <input type="url" id="target_url" 
                               class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-5 py-4 text-lg focus:outline-none focus:border-red-600"
                               placeholder="https://example.com" required>
                    </div>

                    <div>
                        <label class="block text-sm text-zinc-400 mb-2">Proxy (необов'язково)</label>
                        <input type="text" id="proxy" 
                               class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-5 py-4"
                               placeholder="http://user:pass@ip:port або socks5://ip:port">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <button type="button" onclick="startScan('quick')"
                                class="bg-gradient-to-r from-red-600 to-red-700 hover:from-red-500 py-6 rounded-2xl font-semibold text-lg transition-all">
                            ⚡ ШВИДКИЙ СКАН
                        </button>
                        <button type="button" onclick="startScan('full')"
                                class="bg-gradient-to-r from-orange-600 to-red-700 hover:from-orange-500 py-6 rounded-2xl font-semibold text-lg transition-all">
                            🔥 РОЗШИРЕНИЙ СКАН
                        </button>
                    </div>
                </form>

                <!-- Результати -->
                <div id="results" class="hidden mt-10">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-2xl font-bold">Результати сканування</h3>
                        <div class="flex gap-3">
                            <button onclick="loadLogs()" 
                                    class="text-zinc-400 hover:text-white px-4 py-2 rounded-xl border border-zinc-700 text-sm">
                                📜 Логи
                            </button>
                            <button onclick="clearLogs()" 
                                    class="text-red-400 hover:text-red-500 px-4 py-2 rounded-xl border border-red-900 text-sm">
                                🗑 Очистити логи
                            </button>
                            <button onclick="resetScan()" 
                                    class="text-zinc-400 hover:text-white px-4 py-2 rounded-xl border border-zinc-700 text-sm">
                                Новий скан
                            </button>
                        </div>
                    </div>
                    <div id="scanContent" class="space-y-6"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function startScan(type) {
            const url = document.getElementById('target_url').value.trim();
            const proxy = document.getElementById('proxy').value.trim();

            if (!url) return alert("Введіть URL!");

            document.getElementById('results').classList.remove('hidden');
            document.getElementById('scanContent').innerHTML = `
                <div class="text-center py-16">
                    <div class="animate-spin w-16 h-16 border-4 border-red-600 border-t-transparent rounded-full mx-auto mb-6"></div>
                    <p class="text-xl">Виконується ${type === 'quick' ? 'швидкий' : 'розширений'} скан...</p>
                    <p class="text-zinc-500 mt-2">Працюємо через ${proxy ? 'проксі' : 'пряме з\'єднання'}</p>
                </div>
            `;

            const formData = new FormData();
            formData.append('target_url', url);
            formData.append('scan_type', type);
            if (proxy) formData.append('proxy', proxy);

            try {
                const response = await fetch('/scan', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.error) {
                    document.getElementById('scanContent').innerHTML = `
                        <div class="bg-red-950 border border-red-700 p-8 rounded-2xl text-center">
                            <p class="text-red-400 text-lg">${data.error}</p>
                        </div>`;
                    return;
                }

                displayResults(data);
            } catch (e) {
                document.getElementById('scanContent').innerHTML = `<p class="text-red-400">Помилка з'єднання з сервером.</p>`;
            }
        }

        function displayResults(data) {
            let html = `<div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-6">`;
            html += `<p class="text-emerald-400">✅ Скан завершено для <strong>${data.target}</strong></p>`;
            html += `<p class="text-xs text-zinc-500">Proxy: ${data.proxy} | Час: ${data.timestamp}</p>`;

            if (data.findings && data.findings.length > 0) {
                data.findings.forEach(f => {
                    let color = f.severity === 'Critical' ? 'red' : 
                               f.severity === 'High' ? 'red' : 
                               f.severity === 'Medium' ? 'amber' : 'blue';
                    
                    html += `
                        <div class="mt-6 border-l-4 border-${color}-600 bg-zinc-900 p-5 rounded-r-2xl">
                            <div class="flex justify-between">
                                <span class="font-bold">${f.type}</span>
                                <span class="text-xs px-3 py-1 bg-${color}-950 text-${color}-400 rounded-full">${f.severity}</span>
                            </div>
                            <p class="text-zinc-300 mt-2">${f.description}</p>
                        </div>`;
                });
            } else {
                html += `<div class="text-emerald-400 mt-6">Вразливостей не знайдено на базовому рівні.</div>`;
            }
            html += `</div>`;
            document.getElementById('scanContent').innerHTML = html;
        }

        async function clearLogs() {
            if (!confirm("Очистити всі логи?")) return;
            await fetch('/clear-logs', { method: 'POST' });
            alert("Логи очищено!");
        }

        async function loadLogs() {
            const res = await fetch('/logs');
            const data = await res.json();
            alert("Останні логи:\n\n" + data.logs.join("\n"));
        }

        function resetScan() {
            document.getElementById('results').classList.add('hidden');
            document.getElementById('scanContent').innerHTML = '';
        }
    </script>
</body>
</html>
